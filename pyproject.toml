[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "high-fidelity-editable-ppt"
version = "0.1.0"
description = "High-fidelity PDF/image to editable PowerPoint reconstruction pipeline"
requires-python = ">=3.11"
dependencies = [
  "python-pptx>=1.0.0",
  "pypdf>=5.0.0",
  "Pillow>=10.0.0",
  "PyYAML>=6.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
